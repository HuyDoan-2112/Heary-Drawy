<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Drawy is looking</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
body{margin:0}
button{font-family:inherit;cursor:pointer}
a{color:inherit;text-decoration:none}
button:focus-visible,a:focus-visible{outline:4px solid #6C4DF6;outline-offset:4px}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes wave{0%,100%{transform:scaleY(.4)}50%{transform:scaleY(1)}}
@keyframes live{0%,100%{opacity:1}50%{opacity:.3}}
@keyframes dot{0%,100%{opacity:.25}50%{opacity:1}}
@keyframes ring{0%{transform:scale(1);opacity:.5}100%{transform:scale(1.35);opacity:0}}
@keyframes popin{0%{transform:scale(.6);opacity:0}60%{transform:scale(1.08);opacity:1}100%{transform:scale(1)}}
@keyframes introOut{0%,72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(1.05);visibility:hidden}}
@media (prefers-reduced-motion: reduce){*{animation:none !important}.intro{display:none}}
</style>
</helmet>
<div style="width: 820px; height: 1180px; box-sizing: border-box; position: relative; overflow: hidden; background: #D9F0FF; font-family: 'Fredoka', system-ui, sans-serif; color: #1B2B4B">
  <svg width="820" height="300" viewBox="0 0 820 300" preserveAspectRatio="none" aria-hidden="true" style="position: absolute; left: 0; bottom: 0">
    <path d="M0 150 Q200 60 420 125 T820 100 V300 H0 Z" fill="#C6EED8"/>
    <path d="M0 215 Q260 140 520 200 T820 175 V300 H0 Z" fill="#A6E0C0"/>
  </svg>
  <svg width="170" height="70" viewBox="0 0 170 70" aria-hidden="true" style="position: absolute; left: 430px; top: 34px"><path d="M30 60 a24 24 0 0 1 8 -44 a30 30 0 0 1 56 -6 a26 26 0 0 1 44 24 a18 18 0 0 1 2 26 Z" fill="#fff" opacity=".85"/></svg>
  <svg width="130" height="54" viewBox="0 0 170 70" aria-hidden="true" style="position: absolute; left: 150px; top: 40px"><path d="M30 60 a24 24 0 0 1 8 -44 a30 30 0 0 1 56 -6 a26 26 0 0 1 44 24 a18 18 0 0 1 2 26 Z" fill="#fff" opacity=".7"/></svg>
  <button type="button" onClick="{{ toggleMusic }}" aria-label="Music on or off" aria-pressed="{{ musicOn }}" style="{{ musicStyle }}">
    <sc-for list="{{ musicOnList }}" as="mo" hint-placeholder-count="1"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></sc-for>
    <sc-for list="{{ musicOffList }}" as="mf" hint-placeholder-count="0"><svg width="38" height="38" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/><path d="M3 3l18 18"/></svg></sc-for>
  </button>
  <div style="position: absolute; left: 380px; top: 380px; z-index: 4; animation: bob 2.4s ease-in-out infinite"><svg width="400" height="400" viewBox="0 0 200 200" role="img" aria-label="Drawy" style="flex: none; overflow: visible"><g transform="translate(200 0) scale(-1 1)"><g transform="rotate(0 100 120)"><path d="M86 54 C72 40 72 20 84 10 C92 26 96 40 94 54 Z" fill="#2EC4A0" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><path d="M96 52 C92 32 98 14 112 6 C114 24 110 40 104 52 Z" fill="#FFC83D" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><path d="M106 56 C114 40 128 32 142 36 C134 48 122 56 110 58 Z" fill="#6C4DF6" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><ellipse cx="84" cy="186" rx="11" ry="6" fill="#FF9F43" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><ellipse cx="116" cy="186" rx="11" ry="6" fill="#FF9F43" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><path d="M42 112 C26 132 32 162 56 170 C58 148 54 128 42 112 Z" fill="#2EC4A0" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><ellipse cx="100" cy="120" rx="62" ry="66" fill="#FF6F59" stroke="#1B2B4B" stroke-width="5"/><ellipse cx="100" cy="144" rx="36" ry="34" fill="#FFE3A3"/><ellipse cx="66" cy="124" rx="9" ry="6" fill="#FF9FB3"/><ellipse cx="134" cy="124" rx="9" ry="6" fill="#FF9FB3"/><circle cx="80" cy="98" r="14" fill="#fff" stroke="#1B2B4B" stroke-width="4"/><circle cx="88" cy="107" r="7" fill="#1B2B4B"/><circle cx="91" cy="103" r="2.5" fill="#fff"/><circle cx="120" cy="98" r="17" fill="#fff" stroke="#1B2B4B" stroke-width="4"/><circle cx="128" cy="107" r="7" fill="#1B2B4B"/><circle cx="131" cy="103" r="2.5" fill="#fff"/><path d="M66 80 q12 -2 24 4" fill="none" stroke="#1B2B4B" stroke-width="4.5" stroke-linecap="round"/><path d="M108 70 q14 -10 28 -2" fill="none" stroke="#1B2B4B" stroke-width="4.5" stroke-linecap="round"/><path d="M90 112 Q100 102 112 112 Q114 126 102 132 Q100 122 90 116 Z" fill="#FFC83D" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><path d="M152 114 C168 120 180 132 178 148 C166 146 154 136 148 126 Z" fill="#2EC4A0" stroke="#1B2B4B" stroke-width="4" stroke-linejoin="round"/><line x1="184" y1="170" x2="200" y2="194" stroke="#8B5A2B" stroke-width="10" stroke-linecap="round"/><circle cx="168" cy="150" r="26" fill="#DFF3FF" fill-opacity=".8" stroke="#1B2B4B" stroke-width="6"/><path d="M154 140 q6 -10 16 -10" fill="none" stroke="#fff" stroke-width="4" stroke-linecap="round"/></g></g></svg></div>
  <div style="position: absolute; left: 0; right: 0; top: 176px; display: flex; align-items: center; justify-content: center; gap: 22px">
    <h1 style="margin: 0; font-size: 68px; font-weight: 700">Drawy is looking</h1>
    <span style="display: inline-flex; gap: 10px" role="img" aria-label="Please wait"><span style="width: 22px; height: 22px; border-radius: 50%; background: #1B2B4B; animation: dot 1.2s ease-in-out infinite; animation-delay: .0s"></span><span style="width: 22px; height: 22px; border-radius: 50%; background: #1B2B4B; animation: dot 1.2s ease-in-out infinite; animation-delay: .2s"></span><span style="width: 22px; height: 22px; border-radius: 50%; background: #1B2B4B; animation: dot 1.2s ease-in-out infinite; animation-delay: .4s"></span></span>
  </div>
  <div style="position: absolute; left: 80px; top: 330px; width: 420px; height: 400px; box-sizing: border-box; border-radius: 32px; border: 5px solid #1B2B4B; background: #fff; box-shadow: 0 8px 0 #1B2B4B; overflow: hidden" role="img" aria-label="Your drawing">
    <svg viewBox="0 0 760 680" preserveAspectRatio="xMidYMid meet" style="position: absolute; inset: 0; width: 100%; height: 100%" aria-hidden="true">
      <path d="M169 381 A211 211 0 1 0 591 381 A211 211 0 1 0 169 381" fill="none" stroke="#E5483D" stroke-width="16" stroke-linecap="round"/>
      <path d="M380 174 C380 128 393 103 414 81" fill="none" stroke="#8B5A2B" stroke-width="16" stroke-linecap="round"/>
    </svg>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":820,"height":1180}}'>
class Component extends DCLogic {
  constructor(...args) {
    super(...args);
    this.state = { music: true };
  }

  renderVals() {
    return {
      musicOn: this.state.music !== false,
      musicOnList: this.state.music !== false ? [{}] : [],
      musicOffList: this.state.music !== false ? [] : [{}],
      toggleMusic: () => this.setState({ music: this.state.music === false }),
      musicStyle: 'position:absolute;left:30px;top:24px;width:76px;height:76px;border-radius:50%;border:4px solid #1B2B4B;box-shadow:0 4px 0 #1B2B4B;padding:0;display:flex;align-items:center;justify-content:center;z-index:5;' + (this.state.music !== false ? 'background:#6C4DF6;color:#fff;' : 'background:#E4EEF8;color:#1B2B4B;'),
    };
  }
}
</script>
</body>
</html>
