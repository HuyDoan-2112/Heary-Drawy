[project]
name = "heary-drawy-api"
version = "0.1.0"
description = "FastAPI foundation for Heary Drawy"
requires-python = ">=3.12,<3.14"
dependencies = [
  "anyio==4.15.1",
  # faster-whisper 1.2.1 passes av.open(metadata_errors=...), which av 19 removed.
  "av==18.1.0",
  "fastapi==0.119.0",
  "faster-whisper==1.2.1",
  "openai==3.19.2",
  "pillow==12.3.0",
  "psycopg[binary]==3.2.10",
  "pydantic==2.12.2",
  "uvicorn[standard]==0.38.0"
]

[project.optional-dependencies]
dev = [
  "httpx==0.28.1",
  "pgserver==0.1.4; python_version < '3.13'",
  "pytest==8.4.2",
  "ruff==0.17.0"
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["services/api/tests"]
